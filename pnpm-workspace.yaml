packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  # GHSA-ggr8-5vv4-36mx: remove after @prisma/config depends on deepmerge-ts 8+.
  deepmerge-ts: 8.0.2
  # Transitive tooling fixes; remove after ESLint's dependency ranges advance.
  brace-expansion@1.1.16: 1.1.18
  js-yaml@4.3.0: 4.3.1
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  better-sqlite3: true
  esbuild: true
  ffmpeg-static: true
  prisma: true
