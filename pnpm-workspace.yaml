packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  # GHSA-ggr8-5vv4-36mx: remove after @prisma/config depends on deepmerge-ts 8+.
  deepmerge-ts: 8.0.2
  # GHSA-3f6p-5ww8-9rcr and GHSA-rgwj-5xj2-c3m3:
  # remove after Prisma depends on mysql2 3.23.1+.
  mysql2: 3.23.1
  # GHSA-qw65-cvwx-89v3 / GHSA-58mr-gqgx-xq4g: same-major URI fixes
  # for Fastify/Ajv; remove after upstream lockfile resolutions advance.
  fast-uri@3.1.6: 3.1.7
  fast-uri@4.1.3: 4.1.4
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p: cover every installed
  # brace-expansion major without changing minimatch/tooling APIs.
  brace-expansion@1.1.16: 1.1.20
  brace-expansion@2.1.4: 2.1.6
  brace-expansion@5.0.9: 5.0.11
  # Transitive tooling fix; remove after ESLint's dependency range advances.
  js-yaml@4.3.0: 4.3.2
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  better-sqlite3: true
  esbuild: true
  ffmpeg-static: true
  prisma: true
