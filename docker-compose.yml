services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: cinedrive-server
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - subtitle_cache:/app/data/subtitle_cache
    networks:
      - cinedrive_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: cinedrive-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - nginx_logs:/var/log/nginx
    networks:
      - cinedrive_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
    name: cinedrive_app_data
  subtitle_cache:
    name: cinedrive_subtitle_cache
  nginx_logs:
    name: cinedrive_nginx_logs

networks:
  cinedrive_net:
    name: cinedrive_net
