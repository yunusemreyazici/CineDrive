version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: cinedrive-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/apps/server/data/app.db
      - PORT=3000
    volumes:
      - sqlite_data:/app/apps/server/data
    networks:
      - cinedrive-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cinedrive-web
    restart: unless-stopped
    networks:
      - cinedrive-net

  nginx:
    image: nginx:alpine
    container_name: cinedrive-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - web
    networks:
      - cinedrive-net

volumes:
  sqlite_data:

networks:
  cinedrive-net:
    driver: bridge
