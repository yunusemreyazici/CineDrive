version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep Node.js declarations aligned with CineDrive's supported runtimes.
    # Remove this rule when the documented, container, installer, and CI targets
    # intentionally move to a newer Node.js major.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      # Prisma 7 requires its CLI, generated client and driver adapter to move
      # together; independent updates can make client generation fail.
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
      production-patch-and-minor:
        dependency-type: production
        update-types:
          - patch
          - minor
      development-patch-and-minor:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep container runtimes aligned with package.json, CI, the VPS installer,
    # and the documented Node.js support policy. Digest and in-major updates
    # remain enabled.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      docker-base-images:
        patterns:
          - '*'
