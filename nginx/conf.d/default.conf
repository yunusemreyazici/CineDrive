server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nginx Health Check Endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # Apple Universal Links association. Apple requires this exact extensionless
    # path, an application/json response, and no redirect.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    # 1. Video Streaming Proxy (Range Requests, Buffering OFF, 206 Partial Content Preserved)
    location ~ ^/api/media/.+/stream$ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Disable buffering to allow instant video range streaming
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Accel-Buffering no always;
    }

    # 2. HLS Playlist & Segment Proxy
    # Preparing a playlist can wait on a transcode queue, which exceeds the
    # general API read timeout, and buffered segments defeat streaming.
    location ~ ^/api/media/.+/(hls|preview)(/|$) {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # add_header directives are not inherited into a block that declares its
        # own, so the server-level security headers are repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Accel-Buffering no always;
    }

    # 3. Music Streaming & Download Proxy
    # Live fragmented AAC must reach AVPlayer immediately. If this route falls
    # through to the general API proxy, nginx buffers the body and iOS reports
    # NSURLErrorCannotDecodeContentData before the MP4 prefix arrives.
    location ~ ^/api/music/tracks/[^/]+/(stream|download)$ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Accel-Buffering no always;
    }

    # 4. General API Reverse Proxy
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        client_max_body_size 10M;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 5. Static Assets Caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 6. React SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
